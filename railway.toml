[build]
# Run build.sh to install Python packages AND compile the React frontend
builder = "NIXPACKS"
buildCommand = "bash build.sh"

[deploy]
startCommand = "gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[nixpacks]
# System packages needed by pytesseract and pdf2image
aptPackages = ["tesseract-ocr", "tesseract-ocr-khm", "poppler-utils", "libgl1"]
