services:
  - type: web
    name: worshiptool
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    nativePackages:
      - tesseract-ocr
      - tesseract-ocr-khm
      - poppler-utils
      - libgl1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
